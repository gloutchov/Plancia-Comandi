name: Package Windows release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-hex commit approved for packaging
        required: true
      version:
        description: Expected package.json version
        required: true

permissions:
  contents: read

concurrency:
  group: windows-package-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    # A green run only builds on a GitHub-hosted runner. The Windows package
    # stays unverified until that run succeeds and the artifact is tried on a
    # real Windows machine. Do not pass -c.* or --config.* on this shell:
    # PowerShell splits those tokens. Run 43086813880 failed that way. The
    # packaging step calls scripts/package-windows.mjs instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate source and version
        working-directory: app
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const assert=require('node:assert/strict');const cp=require('node:child_process');assert.match(process.env.SOURCE_SHA,/^[0-9a-f]{40}$/);assert.equal(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);assert.equal(require('./package.json').version,process.env.EXPECTED_VERSION)"
      - name: Install pinned dependencies and bundled Windows native prebuild
        working-directory: app
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/node-pty/scripts/prebuild.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/node-pty/scripts/post-install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve the source executable name including spaces
        working-directory: app
        run: |
          $appExe = node ../tooling/scripts/configured-windows-exe.mjs electron-builder.json5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PLANCIA_APP_EXE=$appExe" >> $env:GITHUB_ENV
      - name: Verify full suite including native PowerShell 5.1 and 7 quoting
        working-directory: app
        run: npm test
      - name: TypeScript and production build
        working-directory: app
        run: npm run build
      - name: Verify terminal scrolling and geometry with a synthetic bridge
        working-directory: app
        run: node ../tooling/scripts/smoke-terminal-geometry.mjs .
      - name: Verify window chrome and interactive exclusions
        working-directory: app
        run: node ../tooling/scripts/smoke-window-chrome.mjs .
      - name: Verify terminal protocol and process detection warning
        working-directory: app
        run: node ../tooling/scripts/smoke-terminal-stream.mjs .
      - name: Verify multiline paste confirmation with synthetic clipboard
        working-directory: app
        run: node ../tooling/scripts/smoke-multiline-paste.mjs .
      - name: Package installer and portable executable
        working-directory: app
        run: |
          node ../tooling/scripts/package-windows.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare the open-fuse twin from the finished unpacked app
        run: node tooling/scripts/prepare-open-fuse-twin.mjs app/release/win-unpacked
      - name: Verify initial system language and preserved overrides on the twin
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if ([version]$env:EXPECTED_VERSION -ge [version]'0.3.13') {
            node tooling/scripts/smoke-initial-locale.mjs (Join-Path 'app/release/win-unpacked-open-fuses' $env:PLANCIA_APP_EXE)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Read release and twin fuse wires
        run: node tooling/scripts/check-fuse-wires.mjs (Join-Path 'app/release/win-unpacked' $env:PLANCIA_APP_EXE) (Join-Path 'app/release/win-unpacked-open-fuses' $env:PLANCIA_APP_EXE)
      - name: Smoke the open-fuse twin with the full harness
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node tooling/scripts/smoke-package.mjs (Join-Path 'app/release/win-unpacked-open-fuses' $env:PLANCIA_APP_EXE) "$env:EXPECTED_VERSION" full
      - name: Check safe startup failures on the packaged twin
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node tooling/scripts/smoke-startup-failure.mjs (Join-Path 'app/release/win-unpacked-open-fuses' $env:PLANCIA_APP_EXE) "$env:EXPECTED_VERSION"
      - name: Verify legacy upgrade before installer integrity probes
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if ([version]$env:EXPECTED_VERSION -ge [version]'0.3.13') {
            $upgradeSetup = @(Get-ChildItem app/release/PlanciaComandi-win-*-setup.exe)
            if ($upgradeSetup.Count -ne 1) { throw 'Expected one upgrade installer' }
            & tooling/scripts/smoke-windows-name-upgrade.ps1 -Setup $upgradeSetup[0].FullName -ExpectedVersion $env:EXPECTED_VERSION
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Probe one release fuse at a time
        run: node tooling/scripts/diagnose-fuse-variants.mjs app/release/win-unpacked "$env:RUNNER_TEMP/plancia-fuse-variants/variants.json"
      - name: Read release fuses and reject Node switches
        run: node tooling/scripts/smoke-fuses.mjs (Join-Path 'app/release/win-unpacked' $env:PLANCIA_APP_EXE) (Join-Path 'app/release/win-unpacked-open-fuses' $env:PLANCIA_APP_EXE)
      - name: Smoke unpacked Windows package
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node tooling/scripts/smoke-package.mjs (Join-Path 'app/release/win-unpacked' $env:PLANCIA_APP_EXE) "$env:EXPECTED_VERSION" release
      - name: Inspect package contents
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node tooling/scripts/inspect-package.mjs app/release/win-unpacked/resources app "$env:EXPECTED_VERSION"
      - name: Smoke portable executable and installed application
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $portable = Get-ChildItem app/release/PlanciaComandi-win-*-portable.exe
          $setup = Get-ChildItem app/release/PlanciaComandi-win-*-setup.exe
          if ($portable.Count -ne 1 -or $setup.Count -ne 1) { throw 'Expected one installer and one portable executable' }
          node tooling/scripts/smoke-package.mjs $portable.FullName "$env:EXPECTED_VERSION" release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tooling/scripts/assert-release-fuses.mjs $portable.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $destination = Join-Path $env:RUNNER_TEMP 'plancia-installed-smoke'
          $installer = Start-Process -Wait -PassThru -FilePath $setup.FullName -ArgumentList '/S', "/D=$destination"
          if ($installer.ExitCode) { throw 'Silent installation failed' }
          node tooling/scripts/smoke-package.mjs (Join-Path $destination $env:PLANCIA_APP_EXE) "$env:EXPECTED_VERSION" release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tooling/scripts/assert-release-fuses.mjs (Join-Path $destination $env:PLANCIA_APP_EXE)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tooling/scripts/inspect-package.mjs (Join-Path $destination 'resources') app "$env:EXPECTED_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create SHA-256 manifest
        working-directory: app/release
        run: |
          Get-ChildItem PlanciaComandi-win-*.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS-Windows.txt
          node ../../tooling/scripts/verify-sha256-manifest.mjs SHA256SUMS-Windows.txt .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ inputs.source_sha }}
          path: |
            app/release/PlanciaComandi-win-*.exe
            app/release/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload fuse variant diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-fuse-variants-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/plancia-fuse-variants/variants.json
            ${{ runner.temp }}/plancia-initial-locale-*/report.json
            ${{ runner.temp }}/plancia-name-upgrade-*/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain bounded smoke failure metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-diagnostics-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/plancia-package-smoke-*/smoke-failure.json
            ${{ runner.temp }}/plancia-package-smoke-*/runtime-diagnostics.log
            ${{ runner.temp }}/plancia-fuse-smoke-*/smoke-failure.json
            ${{ runner.temp }}/plancia-terminal-geometry-*/report.json
            ${{ runner.temp }}/plancia-terminal-geometry-*/failure.png
            ${{ runner.temp }}/plancia-window-chrome-*/report.json
            ${{ runner.temp }}/plancia-window-chrome-*/native-window.json
            ${{ runner.temp }}/plancia-window-chrome-*/failure.png
            ${{ runner.temp }}/plancia-multiline-paste-*/report.json
            ${{ runner.temp }}/plancia-multiline-paste-*/failure.png
            ${{ runner.temp }}/plancia-initial-locale-*/*/failure.json
            ${{ runner.temp }}/plancia-initial-locale-*/*/failure.png
          if-no-files-found: ignore
          retention-days: 7
